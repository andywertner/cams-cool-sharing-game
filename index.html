<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cam's Cool Sharing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="title-block">
        <h1>Cam's Cool Sharing Game</h1>
        <p class="credit">Made from a plan by Cameron, grade 8.</p>
      </div>
      <div class="hud">
        <div class="timer-box" aria-live="polite">
          <span class="hud-label">Time</span>
          <span id="timer" class="hud-value">0.0s</span>
        </div>
        <div class="kindness-box">
          <span class="hud-label">Kindness</span>
          <div class="kindness-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="kindnessTrack">
            <div id="kindnessFill" class="kindness-fill"></div>
          </div>
        </div>
        <div class="zoom-box">
          <span class="hud-label">Zoom</span>
          <div class="zoom-row" id="zoomRow"></div>
        </div>
      </div>
    </header>

    <p class="prompt" id="prompt">Share the toys!</p>

    <main class="play-area">
      <section class="children-area" aria-label="Children">
        <h2 class="section-title">Friends</h2>
        <div id="childrenRow" class="children-row"></div>
      </section>

      <section class="toys-area" aria-label="Toys to share">
        <h2 class="section-title">Toys to share</h2>
        <div id="toysRow" class="toys-row"></div>
        <p class="hint" id="hint">Drag a toy to a friend, or tap a toy then tap a friend.</p>
      </section>
    </main>

    <section class="toybox" aria-label="Toy box">
      <h2 class="section-title">Toy box</h2>
      <div class="toybox-controls">
        <button type="button" class="big-btn" id="btnAdd">Add a toy</button>
        <button type="button" class="big-btn" id="btnRename">Change a toy's name</button>
        <button type="button" class="big-btn" id="btnRemove">Take a toy away</button>
        <button type="button" class="big-btn secondary" id="btnReset">Reset toys</button>
      </div>
      <div id="toyboxList" class="toybox-list"></div>
    </section>

    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

    <div id="winOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="overlay-card">
        <h2 id="winTitle">You shared with kindness!</h2>
        <p id="winMessage">Everyone has a toy. Great job sharing!</p>
        <p id="winTime" class="win-time"></p>
        <button type="button" class="big-btn" id="btnPlayAgain">Play again</button>
      </div>
    </div>

    <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="overlay-card modal-card">
        <h2 id="modalTitle">Toy box</h2>
        <p id="modalBody"></p>
        <div id="modalChoices" class="modal-choices"></div>
        <label id="modalLabel" class="modal-label hidden" for="modalInput">Name</label>
        <input id="modalInput" class="modal-input hidden" type="text" maxlength="18" autocomplete="off">
        <div class="modal-actions">
          <button type="button" class="big-btn secondary" id="modalCancel">Cancel</button>
          <button type="button" class="big-btn" id="modalOk">OK</button>
        </div>
      </div>
    </div>

    <div class="feedback-dock">
      <form id="feedbackForm" class="feedback-panel hidden" method="post" action="https://script.google.com/macros/s/AKfycbzQSZ0sy15Q08nF2OXAw9d5Chn1ppKoobJqw5vOj5w-lRr4JxsxtUxXxRc9m7TIU6Cm/exec" target="feedbackFrame" autocomplete="off">
        <input type="hidden" name="app" value="Cam's Cool Sharing Game">
        <label for="feedbackName">Name</label>
        <input id="feedbackName" name="name" type="text" maxlength="40" autocomplete="off">
        <label for="feedbackGrade">Your grade</label>
        <select id="feedbackGrade" name="grade">
          <option value=""></option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
        <label for="feedbackText">Feedback</label>
        <textarea id="feedbackText" name="feedback" rows="2" maxlength="240"></textarea>
        <p id="feedbackNote" class="feedback-note" aria-live="polite"></p>
        <div class="feedback-actions">
          <button type="button" id="feedbackClose">Close</button>
          <button type="submit" id="feedbackSubmit">Submit</button>
        </div>
      </form>
      <button type="button" id="feedbackOpen" class="feedback-open">Feedback</button>
    </div>
  </div>
  <iframe name="feedbackFrame" id="feedbackFrame" title="Feedback" width="0" height="0"></iframe>
  <script src="game.js"></script>
  <script>
    (function () {
      var form = document.getElementById("feedbackForm");
      var openBtn = document.getElementById("feedbackOpen");
      var closeBtn = document.getElementById("feedbackClose");
      var note = document.getElementById("feedbackNote");
      var submitBtn = document.getElementById("feedbackSubmit");
      var nameInput = document.getElementById("feedbackName");
      var gradeInput = document.getElementById("feedbackGrade");
      var feedbackInput = document.getElementById("feedbackText");
      var sent = false;

      openBtn.addEventListener("click", function () {
        form.classList.remove("hidden");
      });

      closeBtn.addEventListener("click", function () {
        form.classList.add("hidden");
      });

      form.addEventListener("submit", function (event) {
        var nameVal = nameInput.value.replace(/^\s+|\s+$/g, "");
        var gradeVal = gradeInput.value;
        var feedbackVal = feedbackInput.value.replace(/^\s+|\s+$/g, "");
        if (sent || !nameVal || !gradeVal || !feedbackVal) {
          event.preventDefault();
          if (!sent) {
            note.textContent = "Fill in name, grade, and feedback.";
          }
          return;
        }
        nameInput.value = nameVal;
        feedbackInput.value = feedbackVal;
        sent = true;
        note.textContent = "Thanks, that was sent.";
        window.setTimeout(function () {
          submitBtn.disabled = true;
        }, 0);
      });
    })();
  </script>
</body>
</html>
